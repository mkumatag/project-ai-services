apiVersion: v1
kind: Pod
metadata:
  name: benchmark-embedding-cpu
  labels:
    ai-services.io/component: embedding
    ai-services.io/runtime: embedding-cpu
  annotations:
    io.podman.annotations.ulimit: nofile=134217728:134217728,memlock=-1:-1
spec:
  restartPolicy: Never
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 512Mi
  - name: models
    hostPath:
      path: /mnt/models
      type: Directory
  containers:
  - name: embedding
    image: icr.io/ppc64le-oss/vllm-ppc64le:0.28.0
    args:
    - --model
    - /models/ibm-granite/granite-embedding-125m
    - --served-model-name
    - ibm-granite/granite-embedding-125m
    - --port=8001
    - --max-model-len=512
    - --gpu-memory-utilization=0.5
    livenessProbe:
      httpGet:
        path: /health
        port: 8001
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    env:
    - name: OMP_NUM_THREADS
      value: '16'
    resources:
      requests:
        cpu: '2'
        memory: 5Gi
      limits:
        cpu: '2'
        memory: 5Gi
    ports:
    - containerPort: 8001
    volumeMounts:
    - name: models
      mountPath: /models:z
      readOnly: true
    - name: dshm
      mountPath: /dev/shm
