apiVersion: v1
kind: Pod
metadata:
  name: benchmark-reranker-cpu
  labels:
    ai-services.io/component: reranker
    ai-services.io/runtime: reranker-cpu
  annotations:
    io.podman.annotations.ulimit: nofile=134217728:134217728,memlock=-1:-1
spec:
  restartPolicy: Never
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 512Mi
  - name: models
    hostPath:
      path: /mnt/models
      type: Directory
  containers:
  - name: reranker
    image: icr.io/ppc64le-oss/vllm-spyre:latest
    livenessProbe:
      httpGet:
        path: /health
        port: 8002
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    ports:
    - containerPort: 8002
    volumeMounts:
    - name: models
      mountPath: /models:z
      readOnly: true
    - name: dshm
      mountPath: /dev/shm
    args:
    - --model
    - /models/BAAI/bge-reranker-large
    - --served-model-name
    - BAAI/bge-reranker-large
    - --port=8002
    - --max-model-len=1024
    resources:
      requests:
        cpu: '1'
        memory: 5Gi
      limits:
        cpu: '1'
        memory: 5Gi
