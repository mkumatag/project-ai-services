apiVersion: v1
kind: Pod
metadata:
  name: benchmark-reranker-spyre
  labels:
    ai-services.io/component: reranker
    ai-services.io/runtime: reranker-spyre
  annotations:
    io.podman.annotations.ulimit: nofile=134217728:134217728,memlock=-1:-1
    ai-services.io/reranker--spyre-cards: '1'
spec:
  restartPolicy: Never
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 64Gi
  - name: models
    hostPath:
      path: /mnt/models
      type: Directory
  containers:
  - name: reranker
    image: registry.redhat.io/rhaii/vllm-spyre-rhel9:3.5.0
    livenessProbe:
      httpGet:
        path: /health
        port: 8002
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    ports:
    - containerPort: 8002
      hostPort: 8002
    volumeMounts:
    - name: models
      mountPath: /models:z
      readOnly: true
    - name: dshm
      mountPath: /dev/shm
    command:
    - /bin/bash
    args:
    - -c
    - /opt/app-root/spyre_entrypoint.sh --model BAAI/bge-reranker-v2-m3 -tp 1 --served-model-name
      BAAI/bge-reranker-v2-m3 --port 8002
    env:
    - name: VLLM_MODEL_PATH
      value: BAAI/bge-reranker-v2-m3
    - name: AIU_WORLD_SIZE
      value: '1'
    - name: SENDNN_INFERENCE_WARMUP_BATCH_SIZES
      value: '4'
    - name: SENDNN_INFERENCE_WARMUP_PROMPT_LENS
      value: '1024'
    - name: MASTER_PORT
      value: '12356'
    resources:
      requests:
        podman.io/device=/dev/vfio: 1
        memory: 5Gi
      limits:
        podman.io/device=/dev/vfio: 1
        memory: 5Gi
