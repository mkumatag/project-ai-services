apiVersion: v1
kind: Pod
metadata:
  name: benchmark-vllm-cpu-compact
  labels:
    ai-services.io/component: llm
    ai-services.io/profile: compact
    ai-services.io/runtime: vllm-cpu
  annotations:
    io.podman.annotations.ulimit: nofile=134217728:134217728,memlock=-1:-1
spec:
  restartPolicy: Never
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 512Mi
  - name: models
    hostPath:
      path: /mnt/models
      type: Directory
  containers:
  - name: vllm-cpu
    image: icr.io/ppc64le-oss/vllm-ppc64le:0.28.0
    command:
    - /bin/sh
    args:
    - -c
    - exec vllm serve /models/ibm-granite/granite-3.0-8b-instruct --served-model-name
      ibm-granite/granite-3.0-8b-instruct --max-num-batched-tokens=3072 --max-model-len=3072
      --max-num-seqs=16 --port=8000
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 12
    env:
    - name: VLLM_CPU_OMP_THREADS_BIND
      value: auto
    - name: VLLM_CPU_KVCACHE_SPACE
      value: '32'
    resources:
      requests:
        cpu: '10'
        memory: 150Gi
      limits:
        cpu: '10'
        memory: 150Gi
    ports:
    - containerPort: 8000
    volumeMounts:
    - name: models
      mountPath: /models:z
      readOnly: true
    - name: dshm
      mountPath: /dev/shm
