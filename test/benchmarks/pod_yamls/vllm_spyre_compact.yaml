apiVersion: v1
kind: Pod
metadata:
  name: benchmark-vllm-spyre-compact
  labels:
    ai-services.io/component: llm
    ai-services.io/profile: compact
    ai-services.io/runtime: vllm-spyre
  annotations:
    io.podman.annotations.ulimit: nofile=134217728:134217728,memlock=-1:-1
    io.podman.annotations.userns: keep-id
    run.oci.keep_original_groups: '1'
    ai-services.io/llm--spyre-cards: '1'
spec:
  restartPolicy: Never
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 64Gi
  - name: models
    hostPath:
      path: /mnt/models
      type: Directory
  containers:
  - name: vllm-spyre
    image: icr.io/ppc64le-oss/vllm-spyre:latest
    command:
    - /bin/bash
    args:
    - -c
    - exec /opt/app-root/spyre_entrypoint.sh --model ${VLLM_MODEL_PATH} -tp ${AIU_WORLD_SIZE}
      --max-model-len ${MAX_MODEL_LEN} --max-num-seqs ${MAX_BATCH_SIZE} --served-model-name
      ibm-granite/granite-3.0-8b-instruct --port 8000
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 180
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    env:
    - name: VLLM_MODEL_PATH
      value: /models/ibm-granite/granite-3.0-8b-instruct
    - name: AIU_WORLD_SIZE
      value: '1'
    - name: VLLM_SPYRE_USE_CB
      value: '1'
    - name: MAX_MODEL_LEN
      value: '3072'
    - name: MAX_BATCH_SIZE
      value: '16'
    - name: MASTER_PORT
      value: '12355'
    resources:
      requests:
        podman.io/device=/dev/vfio: 1
        memory: 200Gi
      limits:
        podman.io/device=/dev/vfio: 1
        memory: 200Gi
    ports:
    - containerPort: 8000
    volumeMounts:
    - name: models
      mountPath: /models:z
      readOnly: true
    - name: dshm
      mountPath: /dev/shm
